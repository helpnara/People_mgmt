<!doctype html><html lang="ko"><head><meta charset="utf-8">
<!-- 느린 나눔 영상 워터마크 후보 (2026-11-24 · A~E, E 는 글씨 없는 새싹 — 작게 떠도 알아본다). 유튜브: 정사각 · 150×150 이상 · 1MB 미만. 600×600 PNG 로 찍는다(shot.mjs).
     색 · 글꼴은 채널 배너(../banner) 그대로 — 크림 #F7F1E6 · 먹 #2A2622 · 금 #7A5A1E/#C8962E · 명조 Noto Serif KR. 새싹은 세 앱 아이콘의 공통 그림. -->
<style>
@font-face{font-family:M;font-weight:900;src:url('../banner/fonts/NotoSerifKR-900.ttf')}
@font-face{font-family:M;font-weight:700;src:url('../banner/fonts/NotoSerifKR-700.ttf')}
@font-face{font-family:S;font-weight:700;src:url('../banner/fonts/NotoSansKR-700.ttf')}
*{margin:0;padding:0;box-sizing:border-box}
body{background:transparent}
.w{width:600px;height:600px;position:relative;display:flex;align-items:center;justify-content:center}
.c{width:584px;height:584px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center}
/* A 크림 원 · 먹색 명조 두 줄 */
#a .c{background:#F7F1E6;border:10px solid #C8962E}
#a .t{font-family:M;font-weight:900;font-size:150px;line-height:1.08;color:#2A2622;text-align:center;letter-spacing:-4px}
#a .t b{color:#7A5A1E}
/* B 먹색 원 · 크림 '느린' · 금색 '나눔' */
#b .c{background:#2A2622}
#b .t1{font-family:M;font-weight:900;font-size:190px;color:#F7F1E6;letter-spacing:-6px;line-height:1}
#b .t2{font-family:S;font-weight:700;font-size:76px;color:#E2B65A;letter-spacing:22px;margin-top:22px;padding-left:22px}
/* C 투명 · 흰 글씨 + 흰 테두리 원 (어떤 화면 위에서도) */
#c .c{border:16px solid #fff;filter:drop-shadow(0 0 14px rgba(0,0,0,.55))}
#c .t{font-family:M;font-weight:900;font-size:150px;line-height:1.08;color:#fff;text-align:center;letter-spacing:-4px}
/* D 크림 원 · 새싹 + 작은 '느린 나눔' */
#d .c{background:#F7F1E6;border:10px solid #EAD9BE}
#d .t{font-family:M;font-weight:900;font-size:84px;color:#2A2622;letter-spacing:-2px;margin-top:6px}
</style></head><body>
<div class="w" id="a"><div class="c"><div class="t">느린<br><b>나눔</b></div></div></div>
<div class="w" id="b"><div class="c"><div class="t1">느린</div><div class="t2">나눔</div></div></div>
<div class="w" id="c"><div class="c"><div class="t">느린<br>나눔</div></div></div>
<div class="w" id="d"><div class="c">
<svg width="300" height="270" viewBox="0 0 300 270">
  <path d="M150 260 C150 200 150 160 150 120" stroke="#3E7D3A" stroke-width="22" stroke-linecap="round" fill="none"/>
  <path d="M150 140 C120 70 60 50 20 70 C40 130 100 160 150 140 Z" fill="#5FA34A"/>
  <path d="M150 120 C170 50 230 20 280 40 C270 110 210 140 150 120 Z" fill="#3E8A3A"/>
  <rect x="70" y="235" width="160" height="22" rx="11" fill="#C8962E"/>
</svg>
<div class="t">느린 나눔</div></div></div>
<div class="w" id="e"><div class="c" style="background:#F7F1E6;border:10px solid #C8962E">
<svg width="400" height="380" viewBox="0 0 300 285" style="margin-top:20px">
  <path d="M150 260 C150 200 150 160 150 120" stroke="#3E7D3A" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M150 140 C120 70 60 50 20 70 C40 130 100 160 150 140 Z" fill="#5FA34A"/>
  <path d="M150 120 C170 50 230 20 280 40 C270 110 210 140 150 120 Z" fill="#3E8A3A"/>
  <rect x="60" y="238" width="180" height="26" rx="13" fill="#C8962E"/>
</svg></div></div>
</body></html>
