# XcodeGen 설정 — 맥 없이 .xcodeproj 를 만드는 유일한 길이다.
# `.xcodeproj` 는 커밋하지 않는다 (.gitignore). CI 가 `xcodegen generate` 로 만든다.
#
# **앱 이름은 CFBundleDisplayName 한 줄에만 있다** (느린 인연). 타깃 이름(SlowConnection)과
# 번들 ID(com.helpnara.slow.connection)는 이름과 무관하게 고정한다 — 바꾸면 TestFlight 설치본과 남남이 된다.
#
# Info.plist 를 파일로 두지 않고 여기서 만든다 — `sources: App` 이 그 파일을 리소스로도 잡아
# "Multiple commands produce" 로 빌드가 깨지는 것을 피한다.

name: SlowConnection

options:
  bundleIdPrefix: com.helpnara
  developmentLanguage: ko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Core:
    path: Packages/Core

settings:
  base:
    # App Store Connect 의 첫 트레인. "1.0.0" 으로 쓰면 트레인이 하나 더 생긴다 (느린 부자).
    MARKETING_VERSION: "1.0"
    # CI 가 실행 번호를 넣는다 — 빌드 번호와 실행 번호가 늘 같게.
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_LANGUAGE: ko
    # 화면 글자를 컴파일러가 뽑아 번역 목록(Localizable.xcstrings)에 잇는다 — 지금은 한국어뿐이지만 영어를 더할 길을 열어 둔다 (D-8).
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

targets:
  SlowConnection:
    type: application
    platform: iOS
    sources:
      # PrivacyInfo.xcprivacy · Localizable.xcstrings 도 이 glob 이 잡는다. XcodeGen 은 모르는 확장자를
      # 리소스 단계에 넣으므로 번들에 그대로 들어간다. 따로 또 적으면 두 번 잡혀 빌드가 깨진다.
      - App
    dependencies:
      - package: Core
        product: Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.slow.connection
        # 1 = iPhone, 2 = iPad. 유니버설 — 아이폰 배치 우선, iPad 전용 배치는 안정화 뒤 (D-19).
        TARGETED_DEVICE_FAMILY: "1,2"
        # 아이콘이 없으면 App Store 검증이 CFBundleIconName 누락으로 막는다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: complete
        # 인증서를 여기서 지정하지 않는다. 자동 서명은 아카이브를 개발용으로 굽고 내보내기에서
        # 배포용으로 다시 입힌다 (.github/workflows/testflight.yml). 직접 지정하면 "충돌" 로 막힌다.
        CODE_SIGN_STYLE: Automatic
    info:
      path: App/Info.plist
      properties:
        # 스토어 · 홈 화면에 보이는 이름.
        CFBundleDisplayName: 느린 인연
        # 한국어 전용 앱이다. 이걸 안 박아 두면 기기 언어가 영어일 때 날짜가 "Aug 29, 2026" 으로,
        # DatePicker 같은 시스템 UI 도 영어로 나온다 (느린 부자).
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations: [ko]
        # **빌드 설정을 참조하게 한다.** 안 적으면 XcodeGen 이 1 과 1.0 을 글자 그대로 박아 넣어,
        # 워크플로가 넘긴 실행 번호가 앱에 닿지 않는다 (느린 부자 — 36번째 실행이 폰에 빌드 24 로 보였다).
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 아이패드는 네 방향 전부. 다 지원해야 멀티태스킹에 들어간다 (아니면 UIRequiresFullScreen 이 필요).
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 암호화를 직접 쓰지 않는다. 없으면 TestFlight 에 올릴 때마다 수출 규정 질문에 손으로 답해야 한다.
        ITSAppUsesNonExemptEncryption: false
        # Face ID 문구는 앱 잠금(FR-029, P1)을 만드는 빌드에서 함께 넣는다 — 쓰지 않는 권한 문구는 심사에서
        # 설명을 요구받는다 (전수조사 이슈 23). 그날 잊지 않게 여기 적어 둔다 (느린 부자 4번).
        # 명함 촬영 (FR-050). 문서 카메라가 테두리를 찾아 편다. 없으면 실기기에서 카메라가 조용히 거부된다.
        # 사진첩은 시스템 선택기라 권한 창이 뜨지 않는다. 문구는 느린 여백과 맞춰 둔다 (이슈 10). 연락처도 시스템 선택기라 문구가 필요 없다.
        NSPhotoLibraryUsageDescription: 명함 사진을 고르려고 사진첩을 씁니다. 고르신 사진만 읽고 기기 안에만 저장합니다.
        NSCameraUsageDescription: 명함을 촬영할 때 카메라를 씁니다. 사진과 읽은 글자는 기기 안에만 저장됩니다.

  # **앱 테스트** — 저장소를 쓰는 규칙(삭제 범위 · 소개자 비우기 · 같은 이름)을 인메모리 저장소로 시험한다.
  # 순수 셈은 Core 의 `swift test` 가 맡고, 여기는 SwiftData 가 있어야만 시험되는 것만 둔다.
  SlowConnectionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - AppTests
    dependencies:
      - target: SlowConnection
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.helpnara.slow.connection.tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"

schemes:
  SlowConnection:
    build:
      targets:
        SlowConnection: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SlowConnectionTests
    # 아카이브는 Release 로 굽는다. 비워 두면 XcodeGen 기본값에 기대게 된다.
    archive:
      config: Release
