name: TestFlight 배포

# 맥 없이 아이폰에 앱을 올리는 경로다. macOS 러너가 빌드 · 서명 · 업로드를 대신하고,
# 사용자는 TestFlight 앱으로 설치한다. 처음 한 번은 docs/06-ci.md 의 준비 절차를 마쳐야 한다.
# (App ID · App Store Connect 앱 등록 · 저장소 시크릿 4개 — 느린 여백 · 느린 부자와 같은 값)
#
# **수동 실행 전용 워크플로는 기본 브랜치에 있어야 GitHub 이 등록한다** (느린 여백 06-ci §3).
# **빌드는 사용자가 "착수하자" 라고 할 때만** 돌린다 (CLAUDE.md 빌드 규율).

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "테스터에게 보여줄 변경 사항"
        required: false
        default: "느린 인연"
      upload:
        description: "끄면 아카이브 · 서명 · 검사까지만 하고 TestFlight 에 올리지 않는다"
        type: boolean
        required: false
        default: true

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: 빌드 · 서명 · TestFlight 업로드
    runs-on: macos-26
    env:
      SCHEME: SlowConnection
    steps:
      - uses: actions/checkout@v4

      # 애플은 **iOS 26 SDK(Xcode 26+)** 로 빌드한 바이너리만 받는다. 26 미만이면 여기서 멈춘다 —
      # 빌드 · 서명을 다 마친 뒤 업로드에서 409 를 보는 것보다 낫다.
      - name: Xcode 26 이상 선택
        run: |
          set -uo pipefail
          xcver() {
            [ -f "$1/Contents/version.plist" ] || return 1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$1/Contents/version.plist" 2>/dev/null
          }
          CUR_APP=$(xcode-select -p 2>/dev/null || true)
          CUR_APP=${CUR_APP%/Contents/Developer}
          CUR_V=$(xcver "$CUR_APP" || true)
          echo "현재 선택: ${CUR_APP:-(없음)} ${CUR_V:-(?)}"
          NEED=1
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*) ;;
            *) [ "${CUR_V%%.*}" -ge 26 ] && NEED=0 ;;
          esac
          if [ "$NEED" -eq 1 ]; then
            BEST=""; BEST_K=0; BEST_V=""
            for app in /Applications/Xcode*.app; do
              v=$(xcver "$app" || true)
              [ -n "$v" ] || continue
              k=$(echo "$v" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
              echo "  $app → $v"
              if [ "$k" -gt "$BEST_K" ]; then BEST_K=$k; BEST="$app"; BEST_V="$v"; fi
            done
            if [ -n "$BEST" ]; then
              echo "전환: $BEST ($BEST_V)"
              sudo xcode-select -s "$BEST/Contents/Developer"
              CUR_V="$BEST_V"
            fi
          fi
          xcodebuild -version
          echo "iOS SDK: $(xcrun --sdk iphoneos --show-sdk-version)"
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*)
              echo "::error::Xcode 버전을 읽지 못했습니다 (CUR_V='${CUR_V}')."; exit 1 ;;
            *)
              if [ "${CUR_V%%.*}" -lt 26 ]; then
                echo "::error::Xcode 가 ${CUR_V} 입니다. App Store Connect 는 iOS 26 SDK 빌드만 받습니다 — runs-on 러너 이미지를 올려야 합니다."
                exit 1
              fi ;;
          esac

      - name: 개인정보 명세의 키와 값이 Xcode 정의와 맞는지
        run: python3 Tools/privacy/check-privacy-manifest.py

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      # 깨진 셈이 아이폰까지 가면 안 된다. 20초짜리 관문이다.
      - name: 계산 로직 테스트
        run: cd Packages/Core && swift test

      - name: App Store Connect API 키 준비
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_KEY_P8 }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::시크릿 APP_STORE_CONNECT_KEY_P8 이 비어 있습니다. docs/06-ci.md 를 보세요."
            exit 1
          fi
          mkdir -p ~/private_keys
          echo "$KEY" > ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8
          chmod 600 ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8

      - name: 서명 설정 확인
        run: |
          xcodebuild -project SlowConnection.xcodeproj -scheme "$SCHEME" \
            -configuration Release -showBuildSettings 2>/dev/null \
            | grep -Ei 'CODE_SIGN_IDENTITY|CODE_SIGN_STYLE|DEVELOPMENT_TEAM|PROVISIONING_PROFILE|PRODUCT_BUNDLE_IDENTIFIER' \
            || echo "(서명 관련 설정을 찾지 못했습니다)"

      # 아카이브는 자동 서명 + 클라우드 서명으로 굽는다. 성립하는 조건이 셋이다 (느린 부자 — 다섯 번 틀렸다):
      #  · API 키 액세스가 **Admin** 이어야 한다
      #  · 스킴의 archive 구성이 **Release** 여야 한다 (project.yml)
      #  · 팀에 **기기가 최소 하나 등록**돼 있어야 한다 (개발용 프로파일이 기기 없이는 안 나온다)
      # 막다른 길 — 다시 시도하지 말 것: CODE_SIGN_IDENTITY 강제 · CODE_SIGNING_ALLOWED=NO · 애드혹 서명.
      - name: 아카이브
        run: |
          set -o pipefail
          # 빌드 번호는 실행 번호를 쓴다. 같은 번호를 두 번 올릴 수 없으므로 자동 증가가 필요하다.
          xcodebuild archive \
            -project SlowConnection.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/SlowConnection.xcarchive \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            || {
              echo "::error::아카이브 실패. 로그 위쪽의 error: 줄을 먼저 보세요."
              echo "::error::'maximum number of certificates' → 계정의 개발 인증서가 꽉 찼습니다. developer.apple.com → Certificates 에서 오래된 Apple Development 를 폐기하세요 (docs/06-ci.md)."
              echo "::error::'no devices from which to generate a provisioning profile' → 팀에 기기가 하나도 없습니다."
              echo "::error::'No profiles for com.helpnara.slow.connection' → App ID 를 아직 등록하지 않았습니다 (docs/06-ci.md 2단계)."
              exit 1
            }

      - name: 내보내기 설정 만들기
        run: |
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
            <!-- 이게 없으면 Xcode 가 빌드 번호를 App Store Connect 의 마지막 + 1 로 바꿔 버린다.
                 번호는 우리가 정한다 — 실행 번호. -->
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST

      # 여기서 애플 서버에 배포용 인증서와 App Store 프로파일을 만든다.
      # `Cloud signing permission error` 가 나면 코드 문제가 아니라 **API 키 권한**이다 (Admin 이어야 한다).
      - name: IPA 내보내기 (여기서 배포용 서명)
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath build/SlowConnection.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.APP_STORE_CONNECT_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            || {
              echo "::error::내보내기 실패. 'Cloud signing permission error' 라면 API 키 액세스가 Admin 이 아닙니다 — docs/06-ci.md 를 보세요."
              exit 1
            }
          ls -la build/export

      # 폰에 보일 번호를 여기서 읽는다. 실행 번호와 다르면 올리지 않는다.
      - name: 서명 · 버전 · 개인정보 명세 확인
        run: |
          set -euo pipefail
          IPA=$(find build/export -name '*.ipa' | head -1)
          [ -n "$IPA" ] || { echo "::error::IPA 를 찾지 못했습니다"; exit 1; }
          rm -rf build/check && mkdir -p build/check
          unzip -q "$IPA" -d build/check
          APP=$(find build/check/Payload -maxdepth 1 -name '*.app' | head -1)

          echo "── 서명 ──"
          codesign -dv "$APP" 2>&1 | grep -Ei 'Authority|TeamIdentifier|Signature' || true

          echo "── 버전 ──"
          SHORT=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")
          echo "CFBundleShortVersionString=$SHORT CFBundleVersion=$BUILD"
          if [ "$BUILD" != "${{ github.run_number }}" ]; then
            echo "::error::빌드 번호가 실행 번호와 다릅니다 ($BUILD ≠ ${{ github.run_number }}). project.yml 의 CFBundleVersion 이 \$(CURRENT_PROJECT_VERSION) 을 참조하는지 보세요."
            exit 1
          fi
          echo "APP_VERSION=$SHORT ($BUILD)" >> "$GITHUB_ENV"

          echo "── 개인정보 명세 ──"
          MANIFEST="$APP/PrivacyInfo.xcprivacy"
          [ -f "$MANIFEST" ] || { echo "::error::$MANIFEST 가 없습니다."; exit 1; }
          plutil -lint "$MANIFEST"
          plutil -p "$MANIFEST"

      # 올리기 전에 애플 서버로 검증한다. ITMS-9xxxx 오류가 여기서 잡히면 빌드 번호와 메일을 안 쓰고 고칠 수 있다.
      - name: App Store 검증 (올리지 않음)
        run: |
          IPA=$(find build/export -name '*.ipa' | head -1)
          set +e
          xcrun altool --validate-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }} \
            --output-format json 2>&1 | tee build/validate.json
          STATUS=${PIPESTATUS[0]}
          set -e
          if [ "$STATUS" -ne 0 ]; then
            echo "::error::App Store 검증 실패. 위 JSON 의 product-errors 를 보세요."
            exit 1
          fi
          echo "✅ App Store 검증 통과"

      - name: TestFlight 업로드
        if: ${{ inputs.upload != false }}
        run: |
          IPA=$(find build/export -name '*.ipa' | head -1)
          echo "업로드: $IPA"
          xcrun altool --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey ${{ secrets.APP_STORE_CONNECT_KEY_ID }} \
            --apiIssuer ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}

      - name: 업로드 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: build/export/
          if-no-files-found: warn

      - name: 안내
        if: ${{ inputs.upload != false }}
        run: |
          echo "${APP_VERSION} 을 TestFlight 에 올렸습니다. 폰의 TestFlight 에 이 번호로 보입니다."
          echo "애플이 처리하는 데 5~15분 걸립니다. TestFlight 앱에서 설치하세요."
          echo "변경 사항: ${{ inputs.notes }}"
