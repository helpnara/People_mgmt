name: iOS 빌드 · 테스트 · 스크린샷

# 이 저장소는 리눅스 원격 세션에서 개발되므로 거기서는 컴파일할 수 없다.
# 이 워크플로가 그 역할을 대신한다: 푸시할 때마다 macOS 러너에서 빌드하고,
# 시뮬레이터 스크린샷을 screenshots/ 에 커밋해 다음 세션이 눈으로 확인할 수 있게 한다.

on:
  push:
    branches: ["claude/**", main, master]
    paths-ignore:
      - "screenshots/**"
      - "docs/**"
      - "**.md"
      - "Tools/golden/**"
      - "Tools/site/**"
      - ".github/workflows/core-test.yml"
      - ".github/workflows/probe.yml"
      - ".github/workflows/site.yml"
      - ".github/workflows/testflight.yml"
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: 빌드 · 테스트 · 스크린샷
    runs-on: macos-26
    permissions:
      contents: write
    env:
      BUNDLE_ID: com.helpnara.slow.connection
      SCHEME: SlowConnection
    steps:
      - uses: actions/checkout@v4
        with:
          # 스크린샷을 되돌려 커밋해야 하므로 푸시 가능한 체크아웃
          persist-credentials: true

      # 러너 이미지에 Xcode 가 여러 개 깔려 있다. TestFlight 로 올라가는 것과 같은
      # SDK 로 컴파일해야 여기서 통과한 코드가 배포에서도 통과한다.
      - name: Xcode 26 이상 선택
        run: |
          set -uo pipefail
          # 러너가 기본으로 선택해 둔 Xcode 에만 시뮬레이터 런타임이 갖춰져 있다.
          # 그래서 **이미 26 이상이면 손대지 않는다** (느린 부자 — 다른 26.x 로 바꿨다가 "iOS 26.0 is not installed").
          xcver() {
            [ -f "$1/Contents/version.plist" ] || return 1
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' \
              "$1/Contents/version.plist" 2>/dev/null
          }
          CUR_APP=$(xcode-select -p 2>/dev/null || true)
          CUR_APP=${CUR_APP%/Contents/Developer}
          CUR_V=$(xcver "$CUR_APP" || true)
          echo "현재 선택: ${CUR_APP:-(없음)} ${CUR_V:-(?)}"
          NEED=1
          case "${CUR_V%%.*}" in
            ''|*[!0-9]*) ;;
            *) [ "${CUR_V%%.*}" -ge 26 ] && NEED=0 ;;
          esac
          if [ "$NEED" -eq 1 ]; then
            BEST=""; BEST_K=0; BEST_V=""
            for app in /Applications/Xcode*.app; do
              v=$(xcver "$app" || true)
              [ -n "$v" ] || continue
              k=$(echo "$v" | awk -F. '{printf "%d", ($1*10000)+($2*100)+$3}')
              echo "  $app → $v"
              if [ "$k" -gt "$BEST_K" ]; then BEST_K=$k; BEST="$app"; BEST_V="$v"; fi
            done
            if [ -n "$BEST" ]; then
              echo "전환: $BEST ($BEST_V)"
              sudo xcode-select -s "$BEST/Contents/Developer"
            fi
          fi
          xcodebuild -version
          swift --version

      - name: 개인정보 명세의 키와 값이 Xcode 정의와 맞는지
        run: python3 Tools/privacy/check-privacy-manifest.py

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      # 깨진 순수 로직이 시뮬레이터까지 가면 안 된다. 20초짜리 관문이다.
      # (리눅스 러너의 core-test.yml 이 이미 한 번 봤지만, macOS 툴체인에서도 서는지는 여기서만 알 수 있다.)
      - name: Core 테스트
        working-directory: Packages/Core
        run: swift test

      - name: iPhone 시뮬레이터 고르기
        id: sim
        run: |
          # 러너 이미지마다 있는 기기가 달라 이름을 박지 않는다. SE · mini 는 화면이 좁아 제외한다.
          read -r UDID NAME <<< "$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          rank = {'': 3, ' Pro': 2, ' Plus': 1, ' Pro Max': 0}
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\\d+)-(\\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or not name.startswith('iPhone'):
                      continue
                  if 'SE' in name or 'mini' in name:
                      continue
                  n = re.match(r'iPhone (\\d+)(.*)\$', name)
                  if not n:
                      continue
                  key = (version, int(n.group(1)), rank.get(n.group(2), 0))
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          if best is None:
              sys.exit('쓸 만한 iPhone 시뮬레이터를 찾지 못했습니다')
          print(best[1], best[2])
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "선택한 시뮬레이터: $NAME ($UDID)"

      # **iPad 도 한 대 고른다** (D-19 유니버설). 넓은 화면에서 늘어지는 자리를 본다.
      - name: iPad 시뮬레이터 고르기
        id: ipad
        run: |
          read -r UDID NAME <<< "$(xcrun simctl list devices available -j | python3 -c "
          import json, re, sys
          data = json.load(sys.stdin)['devices']
          best = None
          for runtime, devices in data.items():
              if 'iOS' not in runtime:
                  continue
              m = re.search(r'iOS-(\\d+)-(\\d+)', runtime)
              version = (int(m.group(1)), int(m.group(2))) if m else (0, 0)
              for d in devices:
                  name = d.get('name', '')
                  if not d.get('isAvailable') or not name.startswith('iPad'):
                      continue
                  if 'mini' in name:
                      continue
                  size = re.search(r'(\\d+)-inch', name)
                  inch = int(size.group(1)) if size else 0
                  key = (version, inch, 'Pro' in name, name)
                  if best is None or key > best[0]:
                      best = (key, d['udid'], name)
          print(*(best[1], best[2]) if best else ('', ''))
          ")"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "선택한 iPad: ${NAME:-없음} ($UDID)"

      # **오류 줄만 맨 끝에 다시 찍는다.** xcodebuild 로그는 수천 줄이고 오류는 그 한복판에 묻힌다.
      - name: 빌드
        run: |
          set -o pipefail
          if ! xcodebuild \
            -project SlowConnection.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee /tmp/build.log; then
            echo "::group::오류 줄만"
            grep -E "error:|error " /tmp/build.log | head -40 || echo "오류 줄을 못 찾았습니다"
            echo "::endgroup::"
            exit 1
          fi

      # **앱 테스트** (인메모리 저장소) — 삭제 범위 · 소개자 비우기 · 같은 이름.
      - name: 앱 테스트
        run: |
          status=0
          xcodebuild \
            -project SlowConnection.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            test > /tmp/app-tests.log 2>&1 || status=$?
          # 테스트는 앱을 띄워 그 안에서 돈다 — 그 앱과 자료를 지워, 아래 01-empty 가 처음 설치한 모습으로 찍히게 한다.
          xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" "$BUNDLE_ID" >/dev/null 2>&1 || true
          grep -E "Test Case .*(passed|failed)|Executed|error:|XCTAssert" /tmp/app-tests.log | tail -80 || true
          if [ "$status" -ne 0 ]; then
            echo "── 실패 — 로그 꼬리 ──"
            tail -150 /tmp/app-tests.log
            exit "$status"
          fi

      # 개인정보 명세가 번들에 어떤 모양으로 들어갔는지 — 저장소의 파일이 아니라 **번들 안의 실물**을 본다.
      - name: 번들 안의 개인정보 명세
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          MANIFEST="$APP/PrivacyInfo.xcprivacy"
          [ -f "$MANIFEST" ] || { echo "::error::$MANIFEST 가 없습니다."; exit 1; }
          plutil -lint "$MANIFEST"
          plutil -p "$MANIFEST"

      # **화소 검사를 스크린샷 앞에 깐다.** 다시 찍는 고리가 심판과 같은 것을 봐야 한다 (느린 여백 빌드 49).
      - name: 화소 검사 준비 (pillow)
        run: |
          python3 -m venv .ci-venv
          .ci-venv/bin/pip install --quiet --disable-pip-version-check pillow

      - name: 시뮬레이터 스크린샷
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # 상태 바를 고정한다. 그러지 않으면 시계가 매 실행 달라져 스크린샷이 항상 변경됨으로 판정된다.
          status_bar() {
            xcrun simctl status_bar "$1" override \
              --time "9:41" \
              --dataNetwork wifi --wifiMode active --wifiBars 3 \
              --batteryState charged --batteryLevel 100
          }
          status_bar "$UDID"

          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "설치: $APP"
          xcrun simctl install "$UDID" "$APP"

          # **앱이 왜 안 뜨는지 먼저 듣는다.** 스크린샷 고리는 안 떴다 만 말해 주고 이유는 안 말한다.
          echo "── 콘솔을 붙여 한 번 띄워 본다 ──"
          perl -e 'alarm 25; exec @ARGV' \
            xcrun simctl launch --console-pty "$UDID" "$BUNDLE_ID" -seedSampleData 2>&1 \
            | head -60 || true
          echo "── 여기까지 ──"
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true

          mkdir -p screenshots
          rm -f /tmp/shoot-failures

          # 첫 장은 예열 뒤에 찍는다 — 콘솔 탐침 직후의 첫 실행은 홈 화면이 남은 적이 있다.
          xcrun simctl launch "$UDID" "$BUNDLE_ID" -seedSampleData >/dev/null 2>&1 || true
          sleep 8
          xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
          sleep 2

          # **심판과 같은 것을 본다.** 표(Tools/ci/screens.txt)에 있는 장은 내용 칸에 글이 있는지 화소로 본다.
          region_is_blank() {
            local region
            region=$(awk -v f="$1" '$1 == f { print $2 }' Tools/ci/screens.txt)
            [ -n "$region" ] || return 1          # 표에 없으면 안 본다
            ! .ci-venv/bin/python Tools/ci/not-blank.py "screenshots/$1:$region" >/dev/null 2>&1
          }

          # 못 찍은 것보다 **못 찍은 줄 모르는 것**이 훨씬 나쁘다. 그래서 확인하고 아니면 다시 찍는다.
          shoot() {
            local file="$1"; shift
            local attempt pid size previous=0
            for attempt in $(seq 1 "${SHOOT_ATTEMPTS:-3}"); do
              xcrun simctl terminate "$UDID" "$BUNDLE_ID" >/dev/null 2>&1 || true
              pid=$(xcrun simctl launch "$UDID" "$BUNDLE_ID" "$@" | awk '{print $NF}')
              # 다시 찍을수록 더 기다린다.
              sleep $(( ${SHOOT_WAIT:-7} + (attempt - 1) * 6 ))
              # (1) 앱이 살아 있나
              if ! kill -0 "$pid" 2>/dev/null; then
                echo "  앱이 떠 있지 않습니다 (pid $pid). 다시 ($attempt/${SHOOT_ATTEMPTS:-3})"
                sleep 3
                continue
              fi
              xcrun simctl io "$UDID" screenshot "screenshots/$file"
              size=$(stat -f%z "screenshots/$file")
              # (2) 홈 화면은 벽지 때문에 PNG 가 유난히 크다 (3MB 안팎).
              if [ "$size" -ge 2000000 ]; then
                echo "  홈 화면 같습니다 ($size 바이트). 다시 ($attempt/${SHOOT_ATTEMPTS:-3})"
                sleep 5
                continue
              fi
              # (3) 아직 안 그려진 화면은 단색이라 PNG 가 유난히 작다. 기기마다 문턱이 다르다.
              if [ "$size" -ge "${SHOOT_MIN:-100000}" ]; then
                if region_is_blank "$file"; then
                  echo "  내용 칸이 비어 있습니다. 다시 ($attempt/${SHOOT_ATTEMPTS:-3})"
                  sleep 3
                  continue
                fi
                echo "찍음: $file ($size 바이트) $*"
                return 0
              fi
              # (4) **같은 크기가 두 번 나오면 다시 찍어도 같다.** 멎은 화면이다 — 글이 적어 작은 것이지 덜 그려진 것이 아니다.
              if [ "$attempt" -gt 1 ] && [ "$size" -eq "$previous" ] \
                 && [ "$size" -ge "${SHOOT_FLOOR:-40000}" ] \
                 && ! region_is_blank "$file"; then
                echo "찍음: $file ($size 바이트 · 두 번 똑같으므로 멎은 화면으로 본다) $*"
                return 0
              fi
              previous=$size
              echo "  빈 화면 같습니다 ($size 바이트). 다시 ($attempt/${SHOOT_ATTEMPTS:-3})"
              sleep 3
            done
            echo "::error::$file — 여러 번 찍었지만 화면이 비어 있습니다"
            echo "$file" >> /tmp/shoot-failures
          }

          # ── iPhone ──
          # **빈 상태** — 진짜(시뮬레이터) 저장소. 위에서 앱을 지웠으므로 처음 설치한 모습이다.
          shoot 01-empty.png
          shoot 02-people.png -seedSampleData
          shoot 03-person-detail.png -seedSampleData -openPerson 김하늘
          shoot 04-add-person.png -seedSampleData -addPerson
          shoot 05-search.png -seedSampleData -search 멘토
          # **큰 글씨** (접근성). 이 한 장이 없으면 Dynamic Type 이 아무것도 안 바꾸고 있는 것을 못 잡는다.
          shoot 06-large-text.png -seedSampleData \
            -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL
          shoot 07-large-text-detail.png -seedSampleData -openPerson 박서연 \
            -UIPreferredContentSizeCategoryName UICTContentSizeCategoryAccessibilityL
          # **기록 상세 · 기록 추가** (3단계). 김하늘의 가장 최근 기록(분기 회의 · 정유진과 공동)을 연다.
          shoot 09-record-detail.png -seedSampleData -openPerson 김하늘 -openRecord
          shoot 10-add-record.png -seedSampleData -openPerson 김하늘 -addRecord
          # 저장소를 끝내 못 열었을 때의 안내 화면 — 죽지 않고 이 화면이 뜨는지, 지우기 단추가 없는지.
          shoot 08-store-failure.png -simulateStoreFailure

          # ── 다크 모드 ──
          xcrun simctl ui "$UDID" appearance dark
          mkdir -p screenshots/dark
          shoot dark/02-people.png -seedSampleData
          shoot dark/03-person-detail.png -seedSampleData -openPerson 김하늘
          xcrun simctl ui "$UDID" appearance light

          # ── iPad ──
          IPAD="${{ steps.ipad.outputs.udid }}"
          if [ -n "$IPAD" ]; then
            echo "── iPad: ${{ steps.ipad.outputs.name }} ──"
            SHOOT_WAIT=12; SHOOT_ATTEMPTS=4; SHOOT_MIN=250000
            xcrun simctl boot "$IPAD" || true
            xcrun simctl bootstatus "$IPAD" -b
            status_bar "$IPAD"
            xcrun simctl install "$IPAD" "$APP"
            mkdir -p screenshots/ipad
            UDID="$IPAD"
            shoot ipad/02-people.png -seedSampleData
            shoot ipad/03-person-detail.png -seedSampleData -openPerson 김하늘
            UDID="${{ steps.sim.outputs.udid }}"
          else
            echo "::warning::iPad 시뮬레이터가 없어 iPad 스크린샷을 건너뜁니다"
          fi

          ls -la screenshots screenshots/dark screenshots/ipad 2>/dev/null || true

          # 한 장이라도 못 찍었으면 막는다. 스크린샷은 원격 세션에서 앱이 실제로 도는지 보는 유일한 창구다.
          if [ -s /tmp/shoot-failures ]; then
            echo "::error::못 찍은 화면 $(wc -l < /tmp/shoot-failures)장:"
            cat /tmp/shoot-failures
            echo "위의 '콘솔을 붙여 한 번 띄워 본다' 출력에 이유가 있습니다."
            exit 1
          fi
          echo "전부 찍었습니다."

      # **아티팩트 업로드를 커밋보다 앞에** — 커밋이 실패하면 결과물을 못 받는다.
      - name: 빌드 산출물 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/
          if-no-files-found: warn

      - name: 스크린샷을 브랜치에 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf screenshots/failed
          git add -A screenshots
          if git diff --cached --quiet; then
            echo "스크린샷 변화 없음 — 커밋하지 않는다"
            exit 0
          fi
          git commit -m "chore: 시뮬레이터 스크린샷 갱신 (${{ steps.sim.outputs.name }}) [skip ci]"
          # 촬영하는 동안 사람이 푸시하면 밀린다. 리베이스하고 다시 민다 — 스크린샷은 러너 것이 항상 옳다.
          for attempt in 1 2 3; do
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "올렸습니다 (시도 $attempt)"
              exit 0
            fi
            echo "밀렸습니다. 원격을 당겨 리베이스하고 다시 시도합니다 ($attempt/3)"
            git fetch origin ${{ github.ref_name }}
            git rebase -X ours origin/${{ github.ref_name }} || {
              git rebase --abort || true
              sleep $((attempt * 5))
              continue
            }
            sleep $((attempt * 5))
          done
          echo "::error::스크린샷을 세 번 시도했지만 올리지 못했습니다."
          exit 1

      # **못 찍은 사진도 브랜치로 돌려보낸다.** 원격 세션은 아티팩트 저장소를 못 연다 —
      # "왜 못 찍혔나" 를 봐야 할 때 창이 닫혀 있으면 안 된다. 잘 찍힌 사진은 건드리지 않는다.
      - name: 못 찍은 사진을 브랜치에 (원격 세션이 볼 수 있게)
        if: failure()
        run: |
          [ -s /tmp/shoot-failures ] || { echo "못 찍은 사진 목록이 없습니다"; exit 0; }
          mkdir -p /tmp/failed-shots
          while read -r f; do
            [ -f "screenshots/$f" ] && cp "screenshots/$f" "/tmp/failed-shots/$(echo "$f" | tr '/' '-')"
          done < /tmp/shoot-failures
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin ${{ github.ref_name }}
            git reset -q --hard origin/${{ github.ref_name }}
            rm -rf screenshots/failed && mkdir -p screenshots/failed
            cp /tmp/failed-shots/* screenshots/failed/
            git add -A screenshots/failed
            git diff --cached --quiet && { echo "변화 없음"; exit 0; }
            git commit -q -m "chore: 못 찍은 스크린샷 ($(tr '\n' ' ' < /tmp/shoot-failures)) [skip ci]"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "올렸습니다 — screenshots/failed/ (시도 $attempt)"
              exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "::warning::못 찍은 사진을 올리지 못했습니다 — 아티팩트에는 있습니다"
